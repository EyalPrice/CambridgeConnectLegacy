name: Build APK

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.CCL_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ccl.jks"
            echo "CCL_KEYSTORE_FILE=$RUNNER_TEMP/ccl.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          CCL_KEYSTORE_PASSWORD: ${{ secrets.CCL_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -300 > build-errors.txt || true
          gh release view ci-log >/dev/null 2>&1 || gh release create ci-log --prerelease --title "CI build log" --notes "Latest failed build log (for developers)."
          gh release upload ci-log build.log build-errors.txt --clobber

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CambridgeConnectLegacy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CambridgeConnectLegacy-apk
          path: CambridgeConnectLegacy.apk

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v0.2.${{ github.run_number }}" CambridgeConnectLegacy.apk \
            --title "Cambridge Connect Legacy 0.2.${{ github.run_number }}" \
            --notes "Download CambridgeConnectLegacy.apk on your Android phone and open it to install." \
            --latest
