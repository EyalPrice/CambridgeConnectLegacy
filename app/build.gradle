plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
// Release signing key comes from GitHub secrets (see .github/workflows/build.yml).
// It is never stored in this public repository.
def ksFile = System.getenv("CCL_KEYSTORE_FILE")
def ksPass = System.getenv("CCL_KEYSTORE_PASSWORD")
def hasReleaseKey = ksFile != null && ksPass != null && file(ksFile).exists()

android {
    namespace 'io.github.eyalprice.ccl'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.eyalprice.ccl"
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "0.1." + runNumber
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias "ccl"
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Without the secret key (local builds, forks) fall back to the debug key.
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
