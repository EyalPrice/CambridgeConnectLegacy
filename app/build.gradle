plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
// Release signing key comes from GitHub secrets (see .github/workflows/build.yml).
// It is never stored in this public repository.
def ksFile = System.getenv("CCL_KEYSTORE_FILE")
def ksPass = System.getenv("CCL_KEYSTORE_PASSWORD")
def hasReleaseKey = ksFile != null && ksPass != null && file(ksFile).exists()

android {
    namespace 'io.github.eyalprice.ccl'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.eyalprice.ccl"
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "0.2." + runNumber
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias "ccl"
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Without the secret key (local builds, forks) fall back to the debug key.
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
